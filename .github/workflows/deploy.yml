name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Work out the public site URL
        env:
          CUSTOM_URL: ${{ vars.SITE_URL }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ -n "$CUSTOM_URL" ]; then
            echo "SITE_URL=$CUSTOM_URL" >> "$GITHUB_ENV"
          elif [ "${REPO,,}" = "$OWNER.github.io" ]; then
            echo "SITE_URL=https://$OWNER.github.io/" >> "$GITHUB_ENV"
          else
            echo "SITE_URL=https://$OWNER.github.io/$REPO/" >> "$GITHUB_ENV"
          fi
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
